{% extends "base.html" %}

{% block head %}
<style>
    .error-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
        text-align: center;
    }
    
    .error-title {
        font-size: 32px;
        color: var(--primary);
        margin-bottom: 20px;
    }
    
    .error-code {
        font-size: 72px;
        font-weight: bold;
        color: #ff6b6b;
        margin-bottom: 20px;
    }
    
    .error-message {
        font-size: 18px;
        color: var(--text);
        margin-bottom: 30px;
        line-height: 1.6;
    }
    
    .error-details {
        background: white;
        padding: 20px;
        border-radius: 8px;
        margin: 30px 0;
        text-align: left;
        box-shadow: var(--shadow);
    }
    
    .action-buttons {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
    }
    
    .btn-home {
        background: var(--primary);
        color: white;
        padding: 12px 24px;
        border-radius: 6px;
        text-decoration: none;
        transition: all 0.3s;
    }
    
    .btn-home:hover {
        background: var(--primary-hover);
        transform: translateY(-2px);
    }
    
    @media (max-width: 600px) {
        .error-code {
            font-size: 48px;
        }
        
        .error-title {
            font-size: 24px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-code">{{ error_code }}</div>
    <h1 class="error-title">{{ error_title }}</h1>
    <p class="error-message">{{ error_message }}</p>
    
    {% if error_details %}
    <div class="error-details">
        <p><strong>详细信息:</strong></p>
        <p>{{ error_details }}</p>
    </div>
    {% endif %}
    
    <div class="action-buttons">
        <a href="/" class="btn btn-primary">返回首页</a>
        <a href="/training" class="btn btn-secondary">前往训练</a>
    </div>
</div>
{% endblock %}
