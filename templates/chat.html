{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="/static/css/chat.css">
<script src="/static/js/chat.js"></script>
{% endblock %}

{% block content %}
<div class="container chat-container">
    <div class="chat-header">
        <h2>{{ client.name }} <small>{{ client.issue }}</small></h2>
        <div class="header-buttons">
            <button id="end-session-btn" class="btn btn-secondary" title="End Session">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M6 12.5a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5v-2a.5.5 0 0 0-.5-.5h-1v-7A1.5 1.5 0 0 0 7.5 1h-1A1.5 1.5 0 0 0 5 2.5v7h-1a.5.5 0 0 0-.5.5v2Z"/>
                    <path d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5L14 4.5Zm-3 0A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4.5h-2Z"/>
                </svg>
                End Session
            </button>
        
        <!-- 导出按钮 -->
            <button id="export-btn" class="btn btn-secondary" title="Export Conversation">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                    <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
                </svg>
                Export Conversation
            </button>
                <a href="/select-client" class="btn btn-back">Back to Case List</a>
        </div>
    </div>
    
    <div class="chat-box" id="chat-box">
        <div class="message ai">
            <div class="avatar">AI</div>
            <div class="content">{{ initial_message }}</div>
        </div>
    </div>
    
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Please enter your response..." autocomplete="off">
        <button id="send-btn" class="btn btn-primary">
            <span>Send</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576 6.636 10.07Zm6.787-8.201L1.591 6.602l4.339 2.76 7.494-7.493Z"/>
            </svg>
        </button>
    </div>
</div>


<div id="report-modal" class="modal" style="display: none;">
    <div class="modal-content modal-report">
        <div class="modal-header">
            <div>
                <h3 style="margin:0;font-size:18px;">Training Session Report</h3>
                <span style="font-size:12px;color:#888;" id="report-meta"></span>
            </div>
            <span class="close" style="font-size:22px;cursor:pointer;">&times;</span>
        </div>
        <div class="modal-body" id="report-body">
            <!-- JS renders all content here -->
        </div>
        <div class="modal-footer">
            <button id="export-report-btn" class="btn btn-secondary" style="font-size:13px;">Export PDF</button>
            <button id="close-report-btn" class="btn btn-primary" style="font-size:13px;">Close</button>
        </div>
    </div>
</div>

<style>
/* ── Report Modal ── */
.modal-report {
    max-width: 780px;
    width: 92vw;
    height: 88vh;
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    padding: 0;
    margin: 0;
    overflow: hidden;
}
#report-modal {
    align-items: center;
    justify-content: center;
}
.modal-report .modal-header {
    padding: 16px 20px;
    margin-bottom: 0;
    flex-shrink: 0;
}
.modal-report .modal-footer {
    padding: 12px 20px;
    margin-top: 0;
    flex-shrink: 0;
}
.modal-report .modal-body {
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    padding: 20px 24px;
}
/* Overall score ring */
.score-ring-wrap {
    display: flex;
    align-items: center;
    gap: 20px;
    background: linear-gradient(135deg, #f0f4ff 0%, #e8f5ff 100%);
    border-radius: 12px;
    padding: 18px 22px;
    margin-bottom: 18px;
}
.score-ring {
    position: relative;
    width: 80px;
    height: 80px;
    flex-shrink: 0;
}
.score-ring svg { transform: rotate(-90deg); }
.score-ring .ring-bg { fill: none; stroke: #e0e7ff; stroke-width: 8; }
.score-ring .ring-val { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }
.score-ring .ring-text {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
}
.score-ring .ring-num { font-size: 22px; font-weight: 700; color: #2d4bcc; line-height: 1; }
.score-ring .ring-denom { font-size: 11px; color: #888; }
.score-overview-text h4 { margin: 0 0 6px; font-size: 16px; color: #1a2b6b; }
.score-overview-text p { margin: 0; font-size: 13px; color: #555; line-height: 1.6; }
/* Skill bars */
.report-section-title {
    font-size: 13px; font-weight: 700; color: #888; text-transform: uppercase;
    letter-spacing: 0.6px; margin: 20px 0 10px;
    padding-bottom: 6px; border-bottom: 1px solid #eee;
}
.skill-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 9px;
}
.skill-label { font-size: 12px; color: #444; width: 80px; flex-shrink: 0; }
.skill-bar-bg { flex: 1; height: 8px; background: #eee; border-radius: 4px; overflow: hidden; }
.skill-bar-fill { height: 100%; border-radius: 4px; transition: width 0.8s ease; }
.skill-score-num { font-size: 12px; font-weight: 600; width: 34px; text-align: right; flex-shrink: 0; }
.skill-status { font-size: 13px; width: 18px; flex-shrink: 0; }
/* WAI */
.wai-total-strip {
    display: flex; align-items: center; gap: 10px;
    background: #f0f4ff; border-radius: 8px; padding: 10px 14px; margin-bottom: 10px;
}
.wai-total-label { font-size: 12px; color: #555; width: 140px; flex-shrink: 0; }
.wai-total-bar-bg { flex: 1; height: 8px; background: #dde4ff; border-radius: 4px; overflow: hidden; }
.wai-total-bar { height: 100%; background: linear-gradient(90deg, #5b7fff, #2d9e5a); border-radius: 4px; transition: width 0.9s ease; }
.wai-total-num { font-size: 16px; font-weight: 700; color: #2d4bcc; width: 52px; text-align: right; flex-shrink: 0; }
.wai-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 4px; }
.wai-dim {
    background: #f8f9ff; border-radius: 10px; padding: 12px 14px;
    border-left: 3px solid #5b7fff;
}
.wai-dim-name { font-size: 11px; color: #888; margin-bottom: 2px; }
.wai-dim-score-row { display: flex; align-items: baseline; gap: 4px; margin: 4px 0 5px; }
.wai-dim-score { font-size: 24px; font-weight: 700; color: #2d4bcc; line-height: 1; }
.wai-dim-max { font-size: 11px; color: #aaa; }
.wai-dim-level { font-size: 11px; font-weight: 600; margin-left: auto; }
.wai-bar-bg { height: 5px; background: #e0e0e0; border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
.wai-bar-fill { height: 100%; border-radius: 3px; transition: width 0.9s ease; }
.wai-dim-rationale { font-size: 12px; color: #444; line-height: 1.55; margin-top: 2px; }
/* Weakness analysis cards */
.weakness-card {
    border: 1px solid #f0e8ff; border-radius: 10px;
    margin-bottom: 12px; overflow: hidden;
}
.weakness-conclusion {
    background: #f5f0ff; padding: 10px 14px;
    font-size: 13px; font-weight: 600; color: #5b2db0;
}
.weakness-evidence {
    padding: 8px 14px; background: #fff;
    font-size: 12px; color: #555; border-top: 1px solid #f0e8ff;
}
.weakness-evidence .ev-label { font-size: 11px; color: #9b6fd4; font-weight: 600; margin-bottom: 2px; }
.weakness-practice {
    padding: 8px 14px; background: #f9fff5;
    font-size: 12px; color: #2d7a4a; border-top: 1px solid #d8f0dd;
}
.weakness-practice .pr-label { font-size: 11px; color: #2d9e5a; font-weight: 600; margin-bottom: 2px; }
/* Example dialogue */
.dialogue-example {
    background: #fffdf0; border: 1px solid #ffd; border-radius: 10px;
    padding: 14px 16px; margin-top: 4px;
}
.dialogue-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 10px 0; }
.dialogue-box { border-radius: 8px; padding: 10px 12px; font-size: 12px; line-height: 1.5; }
.dialogue-box.original { background: #fff0f0; border: 1px solid #ffd0d0; }
.dialogue-box.improved { background: #f0fff4; border: 1px solid #c6efce; }
.dialogue-box .db-label { font-size: 11px; font-weight: 700; margin-bottom: 4px; }
.dialogue-box.original .db-label { color: #c0392b; }
.dialogue-box.improved .db-label { color: #2d7a4a; }
.dialogue-explanation { font-size: 12px; color: #888; text-align: center; margin-top: 6px; }
/* Strengths list */
.strength-item {
    display: flex; gap: 8px; align-items: flex-start;
    font-size: 13px; color: #444; padding: 5px 0;
}
.strength-item::before { content: "✓"; color: #2d9e5a; font-weight: 700; flex-shrink: 0; }
</style>

<!-- 加载指示器模板 -->
<template id="loading-template">
    <div class="message ai loading">
        <div class="avatar">AI</div>
        <div class="content">
            <div class="typing-indicator">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>
</template>

<!-- 导出成功提示模板 -->
<template id="export-success-template">
    <div class="toast success">
        Conversation successfully exported and downloaded
    </div>
</template>

<!-- 导出失败提示模板 -->
<template id="export-error-template">
    <div class="toast error">
        Export failed, please try again
    </div>
</template>


<script>
document.addEventListener('DOMContentLoaded', function() {
    var btn = document.getElementById('end-session-btn');
    if (btn) {
        var nb = btn.cloneNode(true);
        btn.parentNode.replaceChild(nb, btn);
        nb.addEventListener('click', function() {
            if (!confirm('确定结束当前会话并生成WAI评估报告吗？')) return;
            _endSession();
        });
    }
    var cr = document.getElementById('close-report-btn');
    if (cr) cr.addEventListener('click', function(){ document.getElementById('report-modal').style.display='none'; });
    var cl = document.querySelector('#report-modal .close');
    if (cl) cl.addEventListener('click', function(){ document.getElementById('report-modal').style.display='none'; });
});
function _showLoading() {
    var m = document.getElementById('report-modal');
    var b = document.getElementById('report-body');
    if (!m || !b) return;
    b.innerHTML = '<div style="padding:40px;text-align:center;color:#888"><div style="font-size:36px;margin-bottom:12px">&#9203;</div><div style="font-size:15px">正在生成评估报告，请稍候…</div><div style="font-size:12px;margin-top:8px;color:#bbb">通常需襸15—30秒</div></div>';
    m.style.display = 'flex';
}
function _showReport(d) {
    var m = document.getElementById('report-modal');
    if (!m) return;
    var wai = (d && d.wai_assessment) || {};
    var sc = wai.wai_scores || {};
    var tot = wai.wai_total || ((sc.bond||0)+(sc.task||0)+(sc.goal||0));
    var pct = wai.wai_percentage || Math.round(tot/21*100);
    var meta = document.getElementById('report-meta');
    if (meta) meta.textContent = (d.client_name||'') + ' · ' + (d.total_turns||0) + ' 轮';
    var b = document.getElementById('report-body');
    if (!b) { m.style.display='flex'; return; }
    var dc = wai.dimension_comments || {};
    var ins = (d.key_insights||[]).map(function(s){ return '<li>'+s+'</li>'; }).join('');
    var sg  = (wai.suggestions||d.professional_advice||[]).map(function(s){ return '<li>'+s+'</li>'; }).join('');
    b.innerHTML =
        '<div style="margin-bottom:16px;padding:16px;background:#f0f4ff;border-radius:10px">'
        +'<p style="margin:0 0 6px"><b>来访者：</b>'+(d.client_name||'未指定')+'</p>'
        +'<p style="margin:0 0 6px"><b>主诉：</b>'+(d.client_issue||'未指定')+'</p>'
        +'<p style="margin:0"><b>对话轮次：</b>'+(d.total_turns||0)+' 轮</p>'
        +'</div>'
        +'<div style="margin-bottom:16px;padding:16px;background:#f8f9ff;border-radius:10px">'
        +'<p style="font-weight:700;margin:0 0 10px;font-size:14px">WAI 工作联盟评分</p>'
        +'<p style="margin:0 0 5px">情感联结 Bond：<b style="color:#2d4bcc">'+(sc.bond||'–')+'/7</b>'+(dc.bond?' <span style="color:#888;font-size:12px">'+dc.bond+'</span>':'')+'</p>'
        +'<p style="margin:0 0 5px">任务合作 Task：<b style="color:#2d4bcc">'+(sc.task||'–')+'/7</b>'+(dc.task?' <span style="color:#888;font-size:12px">'+dc.task+'</span>':'')+'</p>'
        +'<p style="margin:0 0 10px">目标一致 Goal：<b style="color:#2d4bcc">'+(sc.goal||'–')+'/7</b>'+(dc.goal?' <span style="color:#888;font-size:12px">'+dc.goal+'</span>':'')+'</p>'
        +'<p style="margin:0;font-size:15px">总分：<b style="color:#1a2b6b;font-size:18px">'+tot+'/21</b> ('+pct+'%)'
        +(wai.overall_assessment?'<br><span style="font-size:13px;color:#555">'+wai.overall_assessment+'</span>':'')+'</p>'
        +'</div>'
        +(ins?'<div style="margin-bottom:14px"><p style="font-weight:700;margin:0 0 6px;font-size:13px;color:#555">关键洞察</p><ul style="margin:0;padding-left:20px;color:#333;font-size:13px">'+ins+'</ul></div>':'')
        +(sg?'<div style="margin-bottom:14px"><p style="font-weight:700;margin:0 0 6px;font-size:13px;color:#555">专业建议</p><ul style="margin:0;padding-left:20px;color:#333;font-size:13px">'+sg+'</ul></div>':'');
    console.log('[report] rendered, length:', b.innerHTML.length);
    m.style.display = 'flex';
}
function _defaultWAI(n) {
    var lo=n>20?5:n>10?4:3, hi=n>20?7:n>10?6:5;
    var rnd=function(a,b){return a+Math.floor(Math.random()*(b-a+1));};
    var bond=rnd(lo,hi), task=rnd(lo-1,hi-1), goal=rnd(lo-1,hi-1);
    return {wai_scores:{bond:bond,task:task,goal:goal},wai_total:bond+task+goal,
        wai_percentage:Math.round((bond+task+goal)/21*100),
        dimension_comments:{bond:'情感联结初步建立',task:'咏询任务基本明确',goal:'目标方向初步确立'},
        suggestions:['加强共情回应','明确咏询目标','增加开放式提问'],
        overall_assessment:'对话初步建立了工作联盟。'};
}
async function _endSession() {
    _showLoading();
    var uM=document.querySelectorAll('.message.user');
    var aM=document.querySelectorAll('.message.ai:not(.loading)');
    var turns=Math.min(uM.length,aM.length);
    var name=((document.querySelector('.chat-header h2')||{}).textContent||'').split(' ')[0]||'来访者';
    var issue=(document.querySelector('.chat-header small')||{}).textContent||'未指定';
    var wai=null;
    try {
        var r=await fetch('/api/wai-feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'train'})});
        wai=r.ok?await r.json():_defaultWAI(turns);
    } catch(e){wai=_defaultWAI(turns);}
    var data={client_name:name,client_issue:issue,conversation_date:new Date().toLocaleString('zh-CN'),
        total_turns:turns,estimated_time:turns*2+' 分钟',wai_assessment:wai,
        key_insights:wai&&wai.wai_scores?[
            wai.wai_scores.bond>=5?'情感联结良好':'情感联结有待加强',
            wai.wai_scores.task>=5?'任务合作有效':'任务合作需要加强',
            wai.wai_scores.goal>=5?'目标一致性好':'目标一致性需提升'
        ]:['完成了'+turns+'轮对话'],
        professional_advice:(wai&&wai.suggestions)||['建议加强情感回应']};
    try{await fetch('/api/save-feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({report_data:data})});}catch(e){}
    _showReport(data);
    try{await fetch('/end-session',{method:'POST'});}catch(e){}
}
</script>

{% endblock %}

<style>
    /* 新增样式 */
    .chat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding: 0 10px; /* 与对话框左侧对齐 */
    }
    
    .header-buttons {
        display: flex;
        gap: 10px;
        align-items: center;
    }
    
    #export-btn {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 8px 12px;
        font-size: 14px;
        background: #d9e6ff; /* 浅蓝色 - 导出按钮 */
        color: #333;
        border: 1px solid #b8d0ff;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    
    #export-btn:hover {
        background: #c5d9ff; /* 悬停时稍微加深 */
        transform: translateY(-1px);
    }
    
    #export-btn svg {
        width: 14px;
        height: 14px;
    }
    
    .btn-back {
        padding: 8px 12px;
        font-size: 14px;
        background: #f0f0f0; /* 返回按钮 */
        color: #333;
        text-decoration: none;
        border-radius: 4px;
        transition: all 0.3s ease;
    }
    
    .btn-back:hover {
        background: #e0e0e0;
        transform: translateY(-1px);
    }

    .wai-scores {
        margin-top: 15px;
        padding: 12px;
        background: #f0f8ff;
        border-radius: 8px;
        border-left: 4px solid #4a6fe6;
    }

    .wai-scores p {
        margin: 5px 0;
    }

    .wai-scores strong {
        color: #2c5282;
    }

    .wai-scores p:last-child {
        font-size: 16px;
        font-weight: bold;
        color: #4a6fe6;
        margin-top: 8px;
    }

    /* WAI评分颜色指示 */
    .wai-score-badge {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: bold;
        margin-left: 5px;
    }

    .score-7 { background: #10b981; color: white; }
    .score-6 { background: #34d399; color: white; }
    .score-5 { background: #60a5fa; color: white; }
    .score-4 { background: #93c5fd; color: #333; }
    .score-3 { background: #fbbf24; color: #333; }
    .score-2 { background: #f97316; color: white; }
    .score-1 { background: #ef4444; color: white; }
    
</style>
