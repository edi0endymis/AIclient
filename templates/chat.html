{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="/static/css/chat.css">
<script src="/static/js/chat.js"></script>
{% endblock %}

{% block content %}
<div class="container chat-container">
    <div class="chat-header">
        <h2>{{ client.name }} <small>{{ client.issue }}</small></h2>
        <div class="header-buttons">
            <button id="end-session-btn" class="btn btn-secondary" title="End Session">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M6 12.5a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5v-2a.5.5 0 0 0-.5-.5h-1v-7A1.5 1.5 0 0 0 7.5 1h-1A1.5 1.5 0 0 0 5 2.5v7h-1a.5.5 0 0 0-.5.5v2Z"/>
                    <path d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5L14 4.5Zm-3 0A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4.5h-2Z"/>
                </svg>
                End Session
            </button>
        
        <!-- 导出按钮 -->
            <button id="export-btn" class="btn btn-secondary" title="Export Conversation">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                    <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
                </svg>
                Export Conversation
            </button>
                <a href="/select-client" class="btn btn-back">Back to Case List</a>
        </div>
    </div>
    
    <div class="chat-box" id="chat-box">
        <div class="message ai">
            <div class="avatar">AI</div>
            <div class="content">{{ initial_message }}</div>
        </div>
    </div>
    
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Please enter your response..." autocomplete="off">
        <button id="send-btn" class="btn btn-primary">
            <span>Send</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576 6.636 10.07Zm6.787-8.201L1.591 6.602l4.339 2.76 7.494-7.493Z"/>
            </svg>
        </button>
    </div>
</div>


<div id="report-modal" class="modal" style="display: none;">
    <div class="modal-content modal-report">
        <div class="modal-header">
            <div>
                <h3 style="margin:0;font-size:18px;">Training Session Report</h3>
                <span style="font-size:12px;color:#888;" id="report-meta"></span>
            </div>
            <span class="close" style="font-size:22px;cursor:pointer;">&times;</span>
        </div>
        <div class="modal-body" id="report-body">
            <!-- JS renders all content here -->
        </div>
        <div class="modal-footer">
            <button id="export-report-btn" class="btn btn-secondary" style="font-size:13px;">Export PDF</button>
            <button id="close-report-btn" class="btn btn-primary" style="font-size:13px;">Close</button>
        </div>
    </div>
</div>

<style>
/* ── Report Modal ── */
.modal-report {
    max-width: 780px;
    width: 92vw;
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    padding: 0;
    overflow: hidden;
}
.modal-report .modal-header {
    padding: 16px 20px;
    margin-bottom: 0;
    flex-shrink: 0;
}
.modal-report .modal-footer {
    padding: 12px 20px;
    margin-top: 0;
    flex-shrink: 0;
}
.modal-report .modal-body {
    overflow-y: auto;
    flex: 1;
    padding: 20px 24px;
}
/* Overall score ring */
.score-ring-wrap {
    display: flex;
    align-items: center;
    gap: 20px;
    background: linear-gradient(135deg, #f0f4ff 0%, #e8f5ff 100%);
    border-radius: 12px;
    padding: 18px 22px;
    margin-bottom: 18px;
}
.score-ring {
    position: relative;
    width: 80px;
    height: 80px;
    flex-shrink: 0;
}
.score-ring svg { transform: rotate(-90deg); }
.score-ring .ring-bg { fill: none; stroke: #e0e7ff; stroke-width: 8; }
.score-ring .ring-val { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }
.score-ring .ring-text {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
}
.score-ring .ring-num { font-size: 22px; font-weight: 700; color: #2d4bcc; line-height: 1; }
.score-ring .ring-denom { font-size: 11px; color: #888; }
.score-overview-text h4 { margin: 0 0 6px; font-size: 16px; color: #1a2b6b; }
.score-overview-text p { margin: 0; font-size: 13px; color: #555; line-height: 1.6; }
/* Skill bars */
.report-section-title {
    font-size: 13px; font-weight: 700; color: #888; text-transform: uppercase;
    letter-spacing: 0.6px; margin: 20px 0 10px;
    padding-bottom: 6px; border-bottom: 1px solid #eee;
}
.skill-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 9px;
}
.skill-label { font-size: 12px; color: #444; width: 80px; flex-shrink: 0; }
.skill-bar-bg { flex: 1; height: 8px; background: #eee; border-radius: 4px; overflow: hidden; }
.skill-bar-fill { height: 100%; border-radius: 4px; transition: width 0.8s ease; }
.skill-score-num { font-size: 12px; font-weight: 600; width: 34px; text-align: right; flex-shrink: 0; }
.skill-status { font-size: 13px; width: 18px; flex-shrink: 0; }
/* WAI */
.wai-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 4px; }
.wai-dim {
    background: #f8f9ff; border-radius: 10px; padding: 12px 14px;
    border-left: 3px solid #5b7fff;
}
.wai-dim-name { font-size: 11px; color: #888; margin-bottom: 4px; }
.wai-dim-score { font-size: 22px; font-weight: 700; color: #2d4bcc; }
.wai-dim-max { font-size: 11px; color: #aaa; }
.wai-dim-note { font-size: 11px; color: #666; margin-top: 4px; line-height: 1.4; }
/* Weakness analysis cards */
.weakness-card {
    border: 1px solid #f0e8ff; border-radius: 10px;
    margin-bottom: 12px; overflow: hidden;
}
.weakness-conclusion {
    background: #f5f0ff; padding: 10px 14px;
    font-size: 13px; font-weight: 600; color: #5b2db0;
}
.weakness-evidence {
    padding: 8px 14px; background: #fff;
    font-size: 12px; color: #555; border-top: 1px solid #f0e8ff;
}
.weakness-evidence .ev-label { font-size: 11px; color: #9b6fd4; font-weight: 600; margin-bottom: 2px; }
.weakness-practice {
    padding: 8px 14px; background: #f9fff5;
    font-size: 12px; color: #2d7a4a; border-top: 1px solid #d8f0dd;
}
.weakness-practice .pr-label { font-size: 11px; color: #2d9e5a; font-weight: 600; margin-bottom: 2px; }
/* Example dialogue */
.dialogue-example {
    background: #fffdf0; border: 1px solid #ffd; border-radius: 10px;
    padding: 14px 16px; margin-top: 4px;
}
.dialogue-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 10px 0; }
.dialogue-box { border-radius: 8px; padding: 10px 12px; font-size: 12px; line-height: 1.5; }
.dialogue-box.original { background: #fff0f0; border: 1px solid #ffd0d0; }
.dialogue-box.improved { background: #f0fff4; border: 1px solid #c6efce; }
.dialogue-box .db-label { font-size: 11px; font-weight: 700; margin-bottom: 4px; }
.dialogue-box.original .db-label { color: #c0392b; }
.dialogue-box.improved .db-label { color: #2d7a4a; }
.dialogue-explanation { font-size: 12px; color: #888; text-align: center; margin-top: 6px; }
/* Strengths list */
.strength-item {
    display: flex; gap: 8px; align-items: flex-start;
    font-size: 13px; color: #444; padding: 5px 0;
}
.strength-item::before { content: "✓"; color: #2d9e5a; font-weight: 700; flex-shrink: 0; }
</style>

<!-- 加载指示器模板 -->
<template id="loading-template">
    <div class="message ai loading">
        <div class="avatar">AI</div>
        <div class="content">
            <div class="typing-indicator">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>
</template>

<!-- 导出成功提示模板 -->
<template id="export-success-template">
    <div class="toast success">
        Conversation successfully exported and downloaded
    </div>
</template>

<!-- 导出失败提示模板 -->
<template id="export-error-template">
    <div class="toast error">
        Export failed, please try again
    </div>
</template>
{% endblock %}

<style>
    /* 新增样式 */
    .chat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding: 0 10px; /* 与对话框左侧对齐 */
    }
    
    .header-buttons {
        display: flex;
        gap: 10px;
        align-items: center;
    }
    
    #export-btn {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 8px 12px;
        font-size: 14px;
        background: #d9e6ff; /* 浅蓝色 - 导出按钮 */
        color: #333;
        border: 1px solid #b8d0ff;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    
    #export-btn:hover {
        background: #c5d9ff; /* 悬停时稍微加深 */
        transform: translateY(-1px);
    }
    
    #export-btn svg {
        width: 14px;
        height: 14px;
    }
    
    .btn-back {
        padding: 8px 12px;
        font-size: 14px;
        background: #f0f0f0; /* 返回按钮 */
        color: #333;
        text-decoration: none;
        border-radius: 4px;
        transition: all 0.3s ease;
    }
    
    .btn-back:hover {
        background: #e0e0e0;
        transform: translateY(-1px);
    }

    .wai-scores {
        margin-top: 15px;
        padding: 12px;
        background: #f0f8ff;
        border-radius: 8px;
        border-left: 4px solid #4a6fe6;
    }

    .wai-scores p {
        margin: 5px 0;
    }

    .wai-scores strong {
        color: #2c5282;
    }

    .wai-scores p:last-child {
        font-size: 16px;
        font-weight: bold;
        color: #4a6fe6;
        margin-top: 8px;
    }

    /* WAI评分颜色指示 */
    .wai-score-badge {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: bold;
        margin-left: 5px;
    }

    .score-7 { background: #10b981; color: white; }
    .score-6 { background: #34d399; color: white; }
    .score-5 { background: #60a5fa; color: white; }
    .score-4 { background: #93c5fd; color: #333; }
    .score-3 { background: #fbbf24; color: #333; }
    .score-2 { background: #f97316; color: white; }
    .score-1 { background: #ef4444; color: white; }
    
</style>
